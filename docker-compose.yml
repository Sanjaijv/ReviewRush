services:
  postgres:
    # pgvector-enabled Postgres 16 image (Phase 11) - same Postgres as
    # before, plus the `vector` extension the repo_symbol_chunks migration
    # enables. Only exercised when CONTEXT_EMBEDDINGS_ENABLED=true.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reviewrush
      POSTGRES_PASSWORD: reviewrush
      POSTGRES_DB: reviewrush
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewrush"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://reviewrush:reviewrush@postgres:5432/reviewrush
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/srv/app
      - ./alembic:/srv/alembic

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://reviewrush:reviewrush@postgres:5432/reviewrush
      REDIS_URL: redis://redis:6379/0
      ANALYSIS_WORKDIR: /var/lib/reviewrush/analysis
      ANALYSIS_VOLUME_NAME: reviewrush_analysis_workspace
    # Lets the worker container reach a host-run Ollama server via
    # http://host.docker.internal:11434 (set AI_OLLAMA_BASE_URL/
    # CONTEXT_EMBEDDINGS to that, not localhost - localhost inside this
    # container means the container itself, not the host). Docker Desktop
    # provides this mapping automatically; on Linux Docker Engine it must be
    # requested explicitly, which is what this does.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/srv/app
      - ./alembic:/srv/alembic
      # SECURITY: grants the worker container full control of the host's
      # Docker daemon (equivalent to host root). Required only if
      # ANALYSIS_SANDBOX_ENABLED=true, so the worker can launch the isolated,
      # network-disabled containers that run untrusted PR code. Leave the
      # pipeline disabled (the default) unless this tradeoff is acceptable
      # for your deployment - see README for alternatives.
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared with sandbox containers so a checked-out PR tree extracted by
      # the worker is visible to them by volume name (not host path), which
      # keeps working even though the worker and Docker daemon may see
      # different filesystem namespaces.
      - analysis_workspace:/var/lib/reviewrush/analysis

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at `next build` time (rewrites() isn't re-read at
        # container start) - the frontend container reaches the api
        # container by its Compose service name, not localhost or the
        # host-published 8010 port.
        BACKEND_ORIGIN: http://api:8000
    ports:
      - "3010:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  analysis_workspace:
    name: reviewrush_analysis_workspace
