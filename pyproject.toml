[project]
name = "reviewrush"
version = "0.1.0"
description = "AI-assisted GitHub code-review and merge system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "redis>=5.1",
    "python-json-logger>=2.0",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pgvector>=0.3",
    "tenacity>=9.0",
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-celery>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# app/static/dashboard (Phase 12's dependency-free dashboard UI, served by
# app/main.py via StaticFiles) has no __init__.py, so `packages.find` above
# never picks it up as a package and a non-editable `pip install .` silently
# omits it - app/main.py then fails at import time because the directory
# doesn't exist in the installed copy. Package-data patterns are relative to
# the "app" package's own directory tree and don't require each
# subdirectory to be its own package.
app = ["static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
